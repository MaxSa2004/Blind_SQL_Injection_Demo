<!doctype html>
<html>
  <head>
    <title>University Event Calendar</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
      }

      h1 {
        margin-bottom: 30px;
      }

      form {
        margin-bottom: 30px;
      }

      input {
        padding: 10px;
        width: 400px;
      }

      button {
        padding: 10px 20px;
      }

      .event {
        border: 1px solid #ddd;
        padding: 20px;
        margin-bottom: 15px;
      }
    </style>
  </head>

  <body>
    <h1>University Event Calendar</h1>

    <form method="GET">
      <input
        type="text"
        name="search"
        placeholder="Search events..."
        value="{{ search }}"
      />

      <button type="submit">Search</button>
    </form>

    {% if events %} {% for event in events %}

    <div class="event">
      <h2>{{ event["title"] }}</h2>

      <p>
        <strong>Date:</strong>
        {{ event["date"] }}
      </p>

      <p>
        <strong>Location:</strong>
        {{ event["location"] }}
      </p>
    </div>

    {% endfor %} {% else %}

    <p>No events found.</p>

    {% endif %}
  </body>
</html>
